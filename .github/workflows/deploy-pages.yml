name: Deploy multiple branch websites

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - resume-bariza-rafi-leressae
      - dimas-profile

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Bariza website
        uses: actions/checkout@v4
        with:
          ref: resume-bariza-rafi-leressae
          path: bariza

      - name: Checkout Dimas website
        uses: actions/checkout@v4
        with:
          ref: dimas-profile
          path: dimas

      - name: Prepare deployment folders
        run: |
          mkdir -p site/bariza
          mkdir -p site/dimas

          cp -r bariza/. site/bariza/
          cp -r dimas/. site/dimas/

          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="id">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Kelompok 8 Portfolio</title>
          </head>
          <body>
            <h1>Portfolio Kelompok 8</h1>
            <ul>
              <li><a href="./bariza/">Portfolio Bariza</a></li>
              <li><a href="./dimas/">Portfolio Dimas</a></li>
            </ul>
          </body>
          </html>
          EOF

          touch site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
